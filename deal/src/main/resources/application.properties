spring.application.name=deal

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/deal_ms_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_schema=deal_schema

# Liquibase configuration
spring.liquibase.default-schema=deal_schema
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# Logging configuration
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.javacode.deal=DEBUG
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG
logging.level.liquibase=DEBUG

# Server configuration
server.port=8080

#
calculator.service.base-url=http://calculator
calculator.service.calc-credit-url=/calculator/calc
calculator.service.calc-offers-url=/calculator/offers