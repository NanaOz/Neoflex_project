version: '3'
services:

  deal-postgresql:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=deal_ms_db
    ports:
      - "5432:5432"
    volumes:
      - deal:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  deal:

networks:
  backend:
